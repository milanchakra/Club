@media (min-width:700px){.hero{padding-top:390px;background-image:linear-gradient(180deg,rgba(26,134,232,0) 0,rgba(26,134,232,0) 270px,#1a86e8 390px,#1a86e8 100%),var(--hi),radial-gradient(circle at 92% 96%,rgba(255,214,64,.6),transparent 42%),linear-gradient(160deg,#1a86e8,#12b8dc);background-size:100% 100%,auto 390px,100% 100%,100% 100%;background-position:0 0,50% 0,0 0,0 0}}.hero h1,.hero p,.hero .est{text-shadow:0 1px 8px rgba(0,0,0,.6)}
.est{display:inline-block;background:var(--gold);color:#0b3a75;font-weight:700;border-radius:14px;padding:0 14px;font-size:13px;letter-spacing:1px}
.hero h1{margin:6px 0 2px;font-size:clamp(28px,8vw,44px);line-height:1.3}
.hero p{margin:0;font-size:14px;opacity:.92}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:22px;border:0;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;background:#fff;color:#0b3a75;margin-top:12px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--blue);color:#fff}.btn.s{background:var(--soft);color:var(--text);margin-top:0}.btn.g{background:linear-gradient(180deg,#ffe066,#ffc61a);color:#0b3a75;font-weight:700}
main{max-width:860px;margin:12px auto 0;padding:0 12px 30px}main.home{margin-top:-38px}
.hero.off{display:none}.tab{display:none}.tab.on{display:block;animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(30,120,230,.14)}
.nv{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;min-height:54px;cursor:pointer;position:relative;justify-content:center}.nv em{font-style:normal}.nv span{font-size:22px;line-height:1.1}
.nv.on{color:var(--blue);font-weight:700}.nv.on::before{content:'';position:absolute;top:-5px;width:28px;height:4px;border-radius:0 0 4px 4px;background:var(--blue)}
.adm{background:var(--green);color:#fff;border-radius:12px;padding:0 10px;font-size:12px;margin-left:8px;line-height:22px}
.pr{display:flex;gap:6px}.btn.wa{background:#25d366;color:#fff;margin-top:0;min-height:40px;padding:0 12px}
.hall .num{font-size:26px;font-weight:700;letter-spacing:1px;margin-top:2px}.hb{display:flex;gap:8px;flex-wrap:wrap}.hb .btn{margin-top:0}
.fi button.fph{top:auto;bottom:6px;left:50%;right:auto;transform:translateX(-50%);width:auto;padding:0 14px;border-radius:18px;background:var(--blue);color:#fff;font-size:13px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.hall{position:relative;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#1e78e6,#19c3d6);box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:2px solid var(--gold)}
.hall .tag{position:absolute;top:-11px;left:16px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;padding:0 12px;border-radius:12px;line-height:22px}
.hall h2{margin:0;font-size:20px}.hall p{margin:0;font-size:14px;opacity:.95}.hall .btn{margin-top:0}
h3.sub{margin:20px 4px 8px;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;border-left:5px solid var(--cyan);padding-left:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:18px;padding:14px 12px;color:#fff;text-align:left;font:inherit;cursor:pointer;box-shadow:var(--sh);min-height:112px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile i{font-style:normal;font-size:28px;background:rgba(255,255,255,.2);width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}

<script type="module">
if(window.FB===undefined){
  const C=(window.SITE||{}).firebase||{};
  if(!C.apiKey){window.FB=null;}
  else{
    try{
      const V='10.12.2',G='https://www.gstatic.com/firebasejs/'+V+'/';
      const [A,Au,Fs,St]=await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-auth.js'),import(G+'firebase-firestore.js'),import(G+'firebase-storage.js')]);
      const app=A.initializeApp(C),auth=Au.getAuth(app),db=Fs.getFirestore(app),st=St.getStorage(app);
      const admins=(window.SITE.adminEmails||[]).map(e=>e.toLowerCase());
      const isAdmin=u=>!!(u&&u.email&&u.emailVerified&&admins.includes(u.email.toLowerCase()));
      const up=async(blob,folder)=>{const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';const r=St.ref(st,path);await St.uploadBytes(r,blob,{contentType:'image/jpeg'});return {url:await St.getDownloadURL(r),path};};
      window.FB={
        onAuth:cb=>Au.onAuthStateChanged(auth,u=>cb(isAdmin(u))),
        async login(){const r=await Au.signInWithPopup(auth,new Au.GoogleAuthProvider());if(!isAdmin(r.user)){await Au.signOut(auth);return false;}return true;},
        watchData:cb=>Fs.onSnapshot(Fs.doc(db,'site','data'),s=>cb(s.exists()?s.data():null),()=>cb(null)),
        saveData:d=>Fs.setDoc(Fs.doc(db,'site','data'),JSON.parse(JSON.stringify(d))),
        upload:up,
        async submitPhoto(blob,name){const u=await up(blob,'uploads');await Fs.addDoc(Fs.collection(db,'uploads'),{url:u.url,path:u.path,name:String(name||'').slice(0,60),status:'pending',createdAt:Fs.serverTimestamp()});},
        watchPending:cb=>Fs.onSnapshot(Fs.query(Fs.collection(db,'uploads'),Fs.orderBy('createdAt','desc')),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
        removeUpload:id=>Fs.deleteDoc(Fs.doc(db,'uploads',id)),
        watchPayments:cb=>Fs.onSnapshot(Fs.query(Fs.collection(db,'payments'),Fs.orderBy('createdAt','desc')),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
        submitPayment:o=>Fs.addDoc(Fs.collection(db,'payments'),{purpose:String(o.purpose||'').slice(0,60),amount:Number(o.amount)||0,name:String(o.name||'').slice(0,80),phone:String(o.phone||'').slice(0,15),ref:String(o.ref||'').slice(0,40),date:String(o.date||'').slice(0,10),source:'visitor',status:'pending',createdAt:Fs.serverTimestamp()}),
        addPayment:o=>Fs.addDoc(Fs.collection(db,'payments'),{...o,source:'admin',createdAt:Fs.serverTimestamp()}),
        updatePayment:(id,patch)=>Fs.updateDoc(Fs.doc(db,'payments',id),patch),
        deletePayment:id=>Fs.deleteDoc(Fs.doc(db,'payments',id))
      };
    }catch(e){console.error('Firebase failed',e);window.FB=null;}
  }
}
window.dispatchEvent(new Event('fb-ready'));

<script id="data" type="application/json">{"about":"মিলন চক্র ক্লাব গড়িয়ার কামডহরি পাড়ার প্রাণকেন্দ্র। প্রজন্মের পর প্রজন্ম ধরে এই ক্লাব কলকাতার পাড়া-সংস্কৃতির উষ্ণ ও নস্টালজিক আবহ ধরে রেখেছে। ক্লাবের প্রিয় খেলার মাঠ ও সাশ্রয়ী জিম এমন এক আনন্দময় আশ্রয়, যেখানে শিশুরা খেলে, প্রতিবেশীরা কাছাকাছি আসে এবং আজীবনের বন্ধুত্ব গড়ে ওঠে। প্রতি শরতে ক্লাবের ঐতিহ্যবাহী দুর্গাপুজো আবেগ, সম্মিলিত উষ্ণতা ও গর্বের মধ্য দিয়ে গোটা পাড়াকে এক সুতোয় বাঁধে। ক্লাবের সামাজিক কাজের মধ্যে রয়েছে স্বাস্থ্য পরীক্ষা শিবির (হেলথ চেক-আপ), পোলিও ড্রপ কর্মসূচি, ত্রাণ তহবিলে দান ও বৃক্ষরোপণ। ক্লাব চত্বর ভোটকেন্দ্র হিসেবেও ব্যবহৃত হয়। খেলাধুলা ও বসে আঁকো প্রতিযোগিতার পাশাপাশি স্বামী বিবেকানন্দ ও নেতাজির জন্মদিন, প্রজাতন্ত্র দিবস, স্বাধীনতা দিবস ও হোলি উদ্‌যাপিত হয়। প্রতি বছর ২৩ মার্চ ক্লাবের প্রতিষ্ঠা দিবস পালন করা হয়, আর শরতে সর্বজনীন দুর্গোৎসব পরিচালনা করা হয়। (নিবন্ধন নং SO150162 / ২০০৭–২০০৮)","aboutEn":"Milan Chakra Club is the heartbeat of Garia’s Kamdahari neighborhood, keeping the warm, nostalgic spirit of Kolkata's para culture alive across generations. Its cherished playground and affordable gym serve as a joyful sanctuary where children play, neighbors bond, and life-long friendships are forged. Every autumn, the club truly unites the community through the raw emotion, collective warmth, and shared pride of its iconic Durga Puja. The club’s social work includes health check-up camps, polio drop programmes, donations to relief funds and tree plantation, and its premises also serve as a polling station. Alongside sports and sit-and-draw competitions, the club celebrates the birthdays of Swami Vivekananda and Netaji, Republic Day, Independence Day and Holi, observes its Foundation Day every 23 March, and organises the Sarbojanin Durga Utsav every autumn. (Regd. No. SO150162 of 2007–2008)","news":[["পূজা মণ্ডপের কাজ চলছে","শারদোৎসবের মণ্ডপ তৈরির কাজ চলছে। সাম্প্রতিক ছবি।","data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJC function packBlob(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82);};im.onerror=()=>res(null);im.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(file);});}
