  if(window.QRCode){try{new QRCode(b,{text:u,width:190,height:190,colorDark:'#0b3a75',colorLight:'#ffffff'});}catch(e){}}
}
function cpRow(lbl,val){return val?`<div><span>${lbl}</span><b>${esc(val)}</b><button class="cp" data-cp="${esc(val)}">${t('copy')}</button></div>`:'';}
function openPay(k){
  cur=k;const p=P(),x=PAYS.find(y=>y.k===k),fee=k==='don'?'':(p.fees[k]||'');
  let h=`<div class="sheet"><h2><span>${x.i} ${t(x.t)}</span><button data-shx aria-label="Close">✕</button></h2>`;
  if(!p.upi&&!p.acc)h+=`<p class="empty">${t('nopay')}</p>`;
  else{
    h+=`<label class="empty">${t('amt')}</label><input id="pa" inputmode="decimal" value="${esc(fee)}" placeholder="${t('any')}"><input id="pw" placeholder="${t('who')}">`;
    if(p.upi)h+=`<div class="qrb" id="qrw"><div id="qrb"></div></div><p class="empty" style="text-align:center;margin:0">${t('scan')}</p><div style="text-align:center"><a id="upl" class="btn p" href="#">${t('payApp')}</a></div>`;
    h+=`<div class="bk">${cpRow(t('payTo'),p.name)}${cpRow(t('upi'),p.upi)}${cpRow(t('bank'),p.bank)}${cpRow(t('acc'),p.acc)}${cpRow(t('ifsc'),p.ifsc)}</div><p class="empty" style="font-size:13px">${t('after')}</p>`;
  }
  $('sh').innerHTML=h+'</div>';$('sh').classList.add('on');updQR();
}
const FAC=[['f1','⚽'],['f2','💪'],['f4','💃'],['f5','🥋'],['f6','🧘'],['f9','🏅'],['f3','🪔'],['f7','🪔'],['f8','🎉']];
let pendFac=null,delFac=null;
const F=k=>{const f=D.fac||(D.fac={});return f[k]||(f[k]={});};
function renderFac(){
  const tools=edit||owner;
  $('fac').innerHTML=FAC.map(([k,e])=>{
    const f=F(k),info=f[lang]||t(k+'d');
    return `<div class="card fc"><div class="fi">${f.img?`<img ${tools?'':'data-lb="1" '}src="${f.img}" alt="">`:e}${tools?`<button class="fph" data-fph="${k}" aria-label="${t('phAdd')}">📷</button>${f.img?`<button class="fdl" data-fdel="${k}">${delFac===k?'✔?':'✕'}</button>`:''}`:''}</div><div class="ft"><b>${t(k)}</b>${edit?`<input data-fi="${k}" maxlength="90" placeholder="${t('infoPh')}" value="${esc(f[lang]||'')}">`:`<small>${esc(info)}</small>`}</div></div>`;
  }).join('');
}
function render(){
  const sec=s=>`<section class="card acc${open.has(s.k)?' open':''}" id="s-${s.k}"><button class="hd" data-t="${s.k}" aria-expanded="${open.has(s.k)}"><span>${s.i} ${s.t[lang]}</span><i>▾</i></button><div class="bd">${body(s)}</div></section>`;
  const by=k=>S.find(x=>x.k===k);
  $('a1').innerHTML=sec(by('about'))+`<h3 class="sub">${t('newsT')}</h3><div class="card news">${body(N)}</div>`;
  $('a2').innerHTML=sec(by('committee'));
  $('a3').innerHTML=`<h3 class="sub">${lang==='bn'?'আরও জানুন':'Explore'}</h3>`+S.filter(s=>s.k!=='about'&&s.k!=='committee').map(sec).join('');
  renderPay();renderFac();
  $('bar').classList.toggle('on',edit);
}
function counters(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const n=+el.dataset.n,d=+el.dataset.d,suf=el.dataset.s||'',t0=performance.now();
    (function step(now){const p=Math.min(1,(now-t0)/1200),e=1-Math.pow(1-p,3);el.textContent=fmt(n*e,d)+suf;if(p<1)requestAnimationFrame(step);})(t0);
  });
}
function hallPhone(){
  for(const k of ['contact','contactEn']){const r=(D[k]||[]).find(r=>/হল|hall/i.test(r[0]||'')&&String(r[1]||'').trim());if(r)return String(r[1]).split(/[\/,]/)[0].trim();}
  return '';
}
function applyLang(){
  document.documentElement.lang=lang;document.title=t('title');
  document.querySelectorAll('[data-l]').forEach(e=>e.textContent=t(e.dataset.l));
  $('lbn').classList.toggle('on',lang==='bn');$('len').classList.toggle('on',lang==='en');
  $('tk').textContent=t('tick')+t('tick');
  const ph=hallPhone();
  $('hall').innerHTML=`<div class="hall"><span class="tag">${t('hallTag')}</span><div><h2>${t('hallT')}</h2><p>${t('hallD')}</p></div>${ph?`<a class="btn g" href="tel:${esc(tel(ph))}">${t('hallCall')}</a>`:`<button class="btn g" data-go="contact">${t('hallNo')}</button>`}</div>`;
  $('short').innerHTML=`<button data-go="gallery"><span>🖼️</span>${t('sg')}</button><button data-go="contact"><span>📞</span>${t('sc')}</button><a href="https://www.google.com/maps/search/?api=1&query=Milan+Chakra+Club+%26+Playground+Vivekananda+Park+Garia+Kolkata" target="_blank" rel="noopener"><span>🔎</span>${t('sgg')}</a><a href="https://www.facebook.com/share/g/1Lrf5QbDJS/" target="_blank" rel="noopener"><span>📘</span>${t('sfb')}</a>`;
  const yrs=new Date().getFullYear()-1952;
  $('stats').innerHTML=`<div class="card stat"><b data-n="${yrs}" data-d="0">${yrs}</b><small>${t('yrs')}</small></div><div class="card stat"><b data-n="4.2" data-d="1" data-s=" ★">4.2 ★</b><small>${t('rate')}</small></div><div class="card stat"><b style="font-size:14px;line-height:2">${t('hrs')}</b><small>${t('open')}</small></div>`;
  counters();
}
function setLang(l){lang=l;try{localStorage.setItem('mcc-lang',l)}catch(e){}applyLang();render();if(cur&&$('sh').classList.contains('on'))openPay(cur);}
$('lbn').onclick=()=>setLang('bn');$('len').onclick=()=>setLang('en');

function pack(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));};im.onerror=()=>res(null);im.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(file);});}

document.body.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  const h=q('[data-t]'),a=q('[data-add]'),d=q('[data-del]'),g=q('[data-go]'),gd=q('[data-gdel]'),lb=q('[data-lb]'),cp=q('[data-cp]'),py=q('[data-pay]');
  const sgb=q('[data-sgs]');
  if(sgb){
    const ph=SG.p.replace(/\D/g,'').replace(/^91(?=\d{10}$)/,''),ok=SG.n.trim().length>=2&&/^\d{10}$/.test(ph)&&SG.m.trim().length>=5;
    if(!ok){e.preventDefault();$('sgerr').textContent=t('sgErr');return;}
    $('sgerr').textContent='';
    const msg=`${lang==='bn'?'পরামর্শ – মিলন চক্র ক্লাব':'Suggestion – Milan Chakra Club'}\n${lang==='bn'?'নাম':'Name'}: ${SG.n.trim()}\n${lang==='bn'?'ফোন':'Phone'}: ${ph}\n${lang==='bn'?'পরামর্শ':'Suggestion'}: ${SG.m.trim()}`;
    sgb.href=sgb.dataset.sgs==='wa'?`https://wa.me/91${sgNo()}?text=${encodeURIComponent(msg)}`:`sms:+91${sgNo()}?body=${encodeURIComponent(msg)}`;
    return;
  }
  const fp=q('[data-fph]'),fd=q('[data-fdel]');
  if(fp){pendFac=fp.dataset.fph;$('ff').click();return;}
  if(fd){const k=fd.dataset.fdel;if(delFac===k){F(k).img='';delFac=null;renderFac();if(!edit)persist();}else{delFac=k;renderFac();}return;}
  if(py){openPay(py.dataset.pay);return;}
  if(q('[data-shx]')||e.target.id==='sh'){$('sh').classList.remove('on');$('sh').innerHTML='';cur=null;return;}
  if(cp){const v=cp.dataset.cp;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{cp.textContent=t('copied')}).catch(()=>{cp.textContent=v});return;}
  if(h){const k=h.dataset.t;open.has(k)?open.delete(k):open.add(k);pendDel=-1;render();}
  else if(a){(D[a.dataset.add]=D[a.dataset.add]||[]).push(a.dataset.y==='rows'?['','']:'');render();}
  else if(d){D[d.dataset.del].splice(+d.dataset.i,1);render();}
  else if(gd){const i=+gd.dataset.gdel;if(pendDel===i){D.gallery.splice(i,1);pendDel=-1;render();if(!edit)persist();}else{pendDel=i;render();}}
  else if(q('[data-gadd]')){if(edit||owner)$('gf').click();else{sendHint=true;render();}}
  else if(g){open.add(g.dataset.go);render();$('s-'+g.dataset.go).scrollIntoView({behavior:'smooth',block:'start'});}
  else if(lb){$('lb').innerHTML=`<img src="${lb.src}" alt="">`;$('lb').classList.add('on');}
  else if(q('#lb')){$('lb').classList.remove('on');$('lb').innerHTML='';}
});
document.body.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='pa'||el.id==='pw'){updQR();return;}
  if(el.dataset.sg){SG[el.dataset.sg]=el.value;return;}
  if(el.dataset.fi){F(el.dataset.fi)[lang]=el.value;return;}
  if(el.dataset.pk){P()[el.dataset.pk]=el.value;return;}
  if(el.dataset.fk){P().fees[el.dataset.fk]=el.value;return;}
  const k=el.dataset.k;if(!k)return;
  if(el.dataset.i===undefined)D[k]=el.value;
  else if(el.dataset.j===undefined)D[k][+el.dataset.i]=el.value;
  else D[k][+el.dataset.i][+el.dataset.j]=el.value;
});
document.body.addEventListener('change',async e=>{
  if(e.target.id==='ff'){const f=e.target.files[0];e.target.value='';if(f&&pendFac){const u=await pack(f);if(u){F(pendFac).img=u;renderFac();if(!edit)persist();}}return;}
  if(e.target.id!=='gf')return;
  const g=D.gallery||(D.gallery=[]);
  for(const f of e.target.files){if(g.length>=24){say(t('many'));break;}const u=await pack(f);if(u)g.push(u);}
  render();if(!edit)persist();
});
const say=m=>{$('msg').textContent=m;const g=$('gmsg');if(g)g.textContent=m;};

$('login').onclick=async()=>{
  if(edit)return;
  say(t('chk'));
  if(typeof claude==='undefined'||!claude.use){say(t('nocl'));return;}
  let u=null,art=null;
  try{u=await claude.use('user');}catch(e){}
  try{art=await claude.use('artifact');}catch(e){}
  if(u&&!u.isOwner()){say(t('noperm'));return;}
  if(!u&&!art){say(t('signin'));return;}
  edit=true;say('');
  S.forEach(x=>open.add(x.k));render();
  $('a1').scrollIntoView({behavior:'smooth'});
};
$('cancel').onclick=()=>location.reload();
async function persist(){
  say(t('saving'));
  try{
    const art=await claude.use('artifact');
    if(!art){say(t('nosave'));return;}
    const c=document.documentElement.cloneNode(true);
    ['a1','a2','a3','pay','stats','fac','tk','hall','short','lb','sh'].forEach(i=>{const n=c.querySelector('#'+i);n.innerHTML='';n.classList.remove('on');});
    c.querySelector('#msg').textContent='';
    c.querySelector('#bar').className='';
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    await art.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(err){say(err&&err.code==='conflict'?t('conf'):t('fail'));}
}
$('save').onclick=persist;
(async()=>{try{if(typeof claude!=='undefined'&&claude.use){const u=await claude.use('user');if(u&&u.isOwner()){owner=true;$('login').hidden=false;render();}}}catch(e){}})();
let ft=0;$('msg').closest('main').nextElementSibling.addEventListener('click',()=>{if(++ft>=5)$('login').hidden=false;});
applyLang();render();
</script>
</body>
</html>
